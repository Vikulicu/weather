<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Weather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--a:#2f6fb0;--b:#5aa0d8;--ink:#fff;--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
*,*::before,*::after{box-sizing:inherit}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--a),var(--b)) fixed;transition:background .6s}
body[data-sky=night]{--a:#0f1b3d;--b:#2a3a6e}
body[data-sky=cloud]{--a:#566274;--b:#8793a3}
body[data-sky=rain]{--a:#2a384b;--b:#52627a}
body[data-sky=storm]{--a:#1d2131;--b:#463f5e}
body[data-sky=snow]{--a:#5f7794;--b:#a3b6cc}
body[data-sky=fog]{--a:#5f6a75;--b:#9aa4ad}
main{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.search{position:relative}
input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:12px 18px;outline:none}
input::placeholder{color:rgba(255,255,255,.7)}
input:focus-visible{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
#results{position:absolute;left:0;right:0;top:50px;z-index:5;margin:0;padding:6px;list-style:none;border-radius:16px;background:#1b2433;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#results li{padding:10px 12px;border-radius:10px;cursor:pointer}
#results li:hover,#results li:focus{background:rgba(255,255,255,.12);outline:none}
#results small{opacity:.65}
.hero{padding:44px 0 28px}
.place{font-size:1.15rem;font-weight:500;margin:0;opacity:.9}
.temp{display:flex;align-items:flex-start;gap:6px;margin:4px 0 0}
.temp b{font-size:clamp(6.5rem,32vw,9.5rem);font-weight:300;line-height:.95;letter-spacing:-.04em;font-variation-settings:"opsz" 96}
.temp span{font-size:2.4rem;font-weight:300;margin-top:14px;opacity:.8}
.cond{font-size:1.5rem;font-weight:500;margin:6px 0 0}
.meta{margin:8px 0 0;opacity:.85}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 0;margin-top:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h2{font-size:.95rem;font-weight:500;margin:0 18px 12px;opacity:.8}
.hours{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{flex:0 0 58px;text-align:center;padding:4px 0}
.h i{display:block;font-style:normal;font-size:1.6rem;margin:6px 0 4px}
.h .p{font-size:.72rem;opacity:.75;min-height:1em}
.row{display:grid;grid-template-columns:54px 34px 1fr 44px;align-items:center;gap:8px;padding:9px 18px}
.row+.row{border-top:1px solid var(--line)}
.row i{font-style:normal;font-size:1.4rem}
.row .rng{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.row .rng span:last-child{text-align:right}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.bar u{position:absolute;top:0;bottom:0;border-radius:3px;background:#fff;opacity:.9}
.row .pp{font-size:.8rem;opacity:.75;text-align:right}
footer{margin-top:22px;font-size:.78rem;opacity:.7;display:flex;justify-content:space-between;gap:12px}
.err{padding:30px 18px;text-align:center}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body data-sky="clear">
<main>
  <div class="search">
    <input id="q" type="search" placeholder="Search a city" autocomplete="off" aria-label="Search a city">
    <ul id="results" hidden></ul>
  </div>
  <section class="hero" aria-live="polite">
    <p class="place" id="place">&nbsp;</p>
    <div class="temp"><b id="t">–</b><span>°</span></div>
    <p class="cond" id="cond">Loading…</p>
    <p class="meta" id="meta"></p>
  </section>
  <section class="panel" id="hp" hidden><h2>Next 12 hours</h2><div class="hours" id="hours"></div></section>
  <section class="panel" id="dp" hidden><h2>5-day forecast</h2><div id="days"></div></section>
  <footer><span id="src"></span><span id="upd"></span></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const SKY = {'☀️':'clear','⛅':'clear','🌙':'night','☁️':'cloud','🌫️':'fog','🌦️':'rain','🌧️':'rain','⛈️':'storm','❄️':'snow'};
let place = JSON.parse(localStorage.getItem('place') || 'null');
const qs = new URLSearchParams(location.search);
if (qs.get('lat') && qs.get('lon')) place = { name: qs.get('name') || qs.get('q') || 'Custom', region: qs.get('region') || '', lat: +qs.get('lat'), lon: +qs.get('lon') };
place = place || { name: 'Cluj-Napoca', region: 'Cluj County', lat: 46.7667, lon: 23.6 };


// ---- Open-Meteo (free, no key, works straight from the browser) ----
const wmo = c => c == 0 ? ['☀️', 'Clear'] : c <= 2 ? ['⛅', 'Partly cloudy'] : c == 3 ? ['☁️', 'Overcast'] :
  c <= 48 ? ['🌫️', 'Fog'] : c <= 57 ? ['🌦️', 'Drizzle'] : c <= 67 ? ['🌧️', 'Rain'] : c <= 77 ? ['❄️', 'Snow'] :
  c <= 82 ? ['🌦️', 'Showers'] : c <= 86 ? ['❄️', 'Snow showers'] : ['⛈️', 'Thunderstorm'];

async function getWeather(lat, lon) {
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=6&wind_speed_unit=kmh` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
    `&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`);
  if (!r.ok) throw new Error(r.status);
  const d = await r.json(), c = d.current;
  const i0 = Math.max(0, d.hourly.time.findIndex(t => t >= c.time.slice(0, 13)));
  return {
    source: 'Open-Meteo', updated: c.time,
    current: { t: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature), hum: c.relative_humidity_2m,
      wind: Math.round(c.wind_speed_10m), text: wmo(c.weather_code)[1], icon: wmo(c.weather_code)[0], day: !!c.is_day },
    hourly: d.hourly.time.slice(i0, i0 + 12).map((t, j) => ({ time: t, t: Math.round(d.hourly.temperature_2m[i0 + j]),
      icon: wmo(d.hourly.weather_code[i0 + j])[0], pop: d.hourly.precipitation_probability[i0 + j] })),
    daily: d.daily.time.slice(0, 5).map((t, j) => ({ date: t, hi: Math.round(d.daily.temperature_2m_max[j]), lo: Math.round(d.daily.temperature_2m_min[j]),
      icon: wmo(d.daily.weather_code[j])[0], text: wmo(d.daily.weather_code[j])[1], pop: d.daily.precipitation_probability_max[j] }))
  };
}

async function search(q) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`);
  const j = await r.json();
  return (j.results || []).map(x => ({ name: x.name, region: x.admin1 || '', country: x.country || '', lat: x.latitude, lon: x.longitude }));
}

async function load() {
  $('#place').textContent = [place.name, place.region].filter(Boolean).join(', ');
  try {
    render(await getWeather(place.lat, place.lon));
  } catch {
    $('#t').textContent = '–'; $('#cond').textContent = 'Could not load the forecast';
    $('#meta').textContent = 'Check your connection and reload the page.';
  }
}

function render(d) {
  const c = d.current;
  $('#t').textContent = c.t;
  $('#cond').textContent = c.icon + '  ' + c.text;
  $('#meta').textContent = `Feels like ${c.feels}° · ${c.hum}% humidity · ${c.wind} km/h wind`;
  document.body.dataset.sky = !c.day && (SKY[c.icon] === 'clear') ? 'night' : (SKY[c.icon] || 'clear');
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.body).getPropertyValue('--a').trim();

  $('#hours').replaceChildren(...d.hourly.map((h, i) => {
    const el = document.createElement('div'); el.className = 'h';
    el.innerHTML = '<span></span><i></i><b></b><div class="p"></div>';
    el.children[0].textContent = i === 0 ? 'Now' : h.time.slice(11, 13) + ':00';
    el.children[1].textContent = h.icon; el.children[2].textContent = h.t + '°';
    el.children[3].textContent = h.pop >= 20 ? h.pop + '%' : '';
    return el;
  }));

  const lo = Math.min(...d.daily.map(x => x.lo)), hi = Math.max(...d.daily.map(x => x.hi)), span = Math.max(1, hi - lo);
  $('#days').replaceChildren(...d.daily.map((x, i) => {
    const el = document.createElement('div'); el.className = 'row';
    const day = i === 0 ? 'Today' : new Date(x.date.slice(0, 10) + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' });
    el.innerHTML = '<span></span><i></i><div class="rng"><span></span><div class="bar"><u></u></div><span></span></div><span class="pp"></span>';
    el.children[0].textContent = day; el.children[1].textContent = x.icon; el.children[1].title = x.text;
    const r = el.children[2].children;
    r[0].textContent = x.lo + '°'; r[2].textContent = x.hi + '°';
    const u = r[1].firstChild; u.style.left = ((x.lo - lo) / span * 100) + '%'; u.style.width = Math.max(6, (x.hi - x.lo) / span * 100) + '%';
    el.children[3].textContent = x.pop >= 20 ? '💧' + x.pop + '%' : '';
    return el;
  }));
  $('#hp').hidden = $('#dp').hidden = false;
  $('#src').textContent = 'Data: ' + d.source;
  $('#upd').textContent = 'Updated ' + d.updated.slice(11, 16);
}

// search
let tm;
const box = $('#results');
$('#q').addEventListener('input', e => {
  clearTimeout(tm);
  const v = e.target.value.trim();
  if (v.length < 2) { box.hidden = true; return; }
  tm = setTimeout(async () => {
    try {
      const list = await search(v);
      box.replaceChildren(...list.map(p => {
        const li = document.createElement('li'); li.tabIndex = 0;
        li.textContent = p.name + ' ';
        const s = document.createElement('small'); s.textContent = [p.region, p.country].filter(Boolean).join(', ');
        li.append(s);
        const pick = () => { place = p; localStorage.setItem('place', JSON.stringify(p)); history.replaceState(null, '', location.pathname); box.hidden = true; $('#q').value = ''; load(); };
        li.onclick = pick; li.onkeydown = ev => ev.key === 'Enter' && pick();
        return li;
      }));
      box.hidden = !list.length;
    } catch { box.hidden = true; }
  }, 250);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) box.hidden = true; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
